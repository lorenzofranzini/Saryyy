<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Pong - Fixed</title>

<style>
body {
    margin: 0;
    background-color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
}

canvas {
    border: 5px solid #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
    background-color: #000;
}

.instructions {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
}
</style>
</head>

<body>

<div class="instructions">Muovi il mouse per giocare</div>
<canvas id="pongCanvas"></canvas>

<script>
const canvas = document.getElementById("pongCanvas");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 400;

const paddleWidth = 10, paddleHeight = 80;
const ballRadius = 10;

let userY = (canvas.height - paddleHeight) / 2;
let aiY = (canvas.height - paddleHeight) / 2;

let ballX = canvas.width / 2;
let ballY = canvas.height / 2;
let ballSpeedX = 5;
let ballSpeedY = 3;

let userScore = 0;
let aiScore = 0;

// CONTROLLI
canvas.addEventListener("mousemove", (e) => {
    let rect = canvas.getBoundingClientRect();
    userY = e.clientY - rect.top - paddleHeight / 2;
});

// DISEGNO
function drawRect(x, y, w, h) {
    ctx.fillStyle = "#FFF";
    ctx.fillRect(x, y, w, h);
}

function drawCircle(x, y, r) {
    ctx.fillStyle = "#FFF";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

function drawText(text, x, y) {
    ctx.font = "40px Courier New";
    ctx.fillText(text, x, y);
}

// RESET PALLA
function resetBall() {
    ballX = canvas.width / 2;
    ballY = canvas.height / 2;

    ballSpeedX = -ballSpeedX;
    ballSpeedY = (Math.random() * 4) - 2; // traiettoria variabile
}

// COLLISIONE
function collision(player) {
    return (
        ballX - ballRadius < player.x + paddleWidth &&
        ballX + ballRadius > player.x &&
        ballY + ballRadius > player.y &&
        ballY - ballRadius < player.y + paddleHeight
    );
}

// UPDATE
function update() {
    ballX += ballSpeedX;
    ballY += ballSpeedY;

    // AI fluida
    let aiTarget = ballY - paddleHeight / 2;
    aiY += (aiTarget - aiY) * 0.1;

    // rimbalzo sopra/sotto
    if (ballY + ballRadius > canvas.height || ballY - ballRadius < 0) {
        ballSpeedY = -ballSpeedY;
    }

    let player = (ballX < canvas.width / 2)
        ? { x: 0, y: userY }
        : { x: canvas.width - paddleWidth, y: aiY };

    if (collision(player)) {
        let collidePoint = (ballY - (player.y + paddleHeight / 2)) / (paddleHeight / 2);

        // clamp
        collidePoint = Math.max(-1, Math.min(1, collidePoint));

        let angle = collidePoint * (Math.PI / 4);
        let direction = (ballX < canvas.width / 2) ? 1 : -1;

        ballSpeedX = direction * (Math.abs(ballSpeedX) * 1.05);
        ballSpeedY = 7 * Math.sin(angle);
    }

    // punteggio
    if (ballX - ballRadius < 0) {
        aiScore++;
        resetBall();
    } else if (ballX + ballRadius > canvas.width) {
        userScore++;
        resetBall();
    }
}

// RENDER
function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // linea centrale
    for (let i = 0; i < canvas.height; i += 30) {
        drawRect(canvas.width / 2 - 1, i, 2, 15);
    }

    // punteggio
    drawText(userScore, canvas.width / 4, 50);
    drawText(aiScore, 3 * canvas.width / 4, 50);

    // racchette
    drawRect(0, userY, paddleWidth, paddleHeight);
    drawRect(canvas.width - paddleWidth, aiY, paddleWidth, paddleHeight);

    // palla
    drawCircle(ballX, ballY, ballRadius);
}

// LOOP
function game() {
    update();
    render();
}

setInterval(game, 1000 / 60);
</script>

</body>
</html>
